[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revachol-radiobot"
version = "1.0.0"
description = "Bot de X/Twitter que publica entradas de un dataset JSON a intervalos fijos, sin la API de pago."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enrico" }]
dependencies = [
    # Fork mantenido de twikit: usa la API interna de x.com con cookies de sesión.
    # Se importa como `twikit`. El extra `impersonate` instala curl_cffi para
    # usar la huella TLS de un navegador real (evita 403 de Cloudflare).
    "twifork[impersonate]",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
revachol-radiobot = "revachol_radiobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
